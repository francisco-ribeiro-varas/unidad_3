<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de juegos de Tienda de juegos.">
    <title>{% block title %}Tienda de juegos{% endblock %}</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #10131c;
            --surface: #191e2b;
            --surface-light: #222a3a;
            --text: #f4f6fb;
            --muted: #a8b0c2;
            --accent: #a8f05a;
            --border: #30394b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            grid-template-rows: auto 1fr auto;
            background: var(--background);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
        }

        .site-header {
            border-bottom: 1px solid var(--border);
            background: rgba(16, 19, 28, 0.94);
        }

        .header-content {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .brand-mark,
        .eyebrow {
            color: var(--accent);
        }

        .header-link {
            color: var(--muted);
            font-size: 0.95rem;
        }

        main {
            width: 100%;
        }

        .hero {
            padding: 72px 0 48px;
        }

        .eyebrow {
            margin: 0 0 12px;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 700px;
            margin: 0;
            font-size: clamp(2.4rem, 7vw, 4.5rem);
            line-height: 1.04;
            letter-spacing: -0.06em;
        }

        .hero-copy,
        .muted-copy {
            color: var(--muted);
            line-height: 1.7;
        }

        .hero-copy {
            max-width: 560px;
            margin: 20px 0 0;
            font-size: 1.05rem;
        }

        .catalog,
        .detail {
            padding: 24px 0 80px;
        }

        .section-heading {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        h2 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: -0.04em;
        }

        .game-count {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .game-card {
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            transition: transform 160ms ease, border-color 160ms ease;
        }

        .game-image,
        .detail-image {
            display: block;
            width: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .game-image {
            aspect-ratio: 16 / 10;
            margin-bottom: 18px;
        }

        .detail-image {
            max-height: 420px;
            margin-bottom: 24px;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .game-category {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .game-name {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: -0.03em;
        }

        .game-description {
            min-height: 48px;
            margin: 12px 0 18px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .game-price {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .empty-state {
            padding: 48px 24px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            color: var(--muted);
            text-align: center;
        }

        .button {
            min-height: 46px;
            padding: 12px 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-weight: 700;
            transition: transform 160ms ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #10131c;
        }

        .button-secondary {
            background: var(--surface);
        }

        .detail-card {
            max-width: 760px;
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
        }

        .detail-card h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
        }

        .detail-description {
            color: var(--muted);
            line-height: 1.7;
        }

        .detail-facts {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 28px;
            margin: 24px 0;
        }

        .detail-facts p {
            margin: 0;
        }

        .error-code {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: clamp(4rem, 15vw, 7rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.08em;
        }

        .error-message {
            max-width: 600px;
            padding: 72px 0;
            margin: 0 auto;
            text-align: center;
        }

        .error-message h1 {
            margin: 0 auto;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .site-footer {
            padding: 24px 0;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
        }

        @media (max-width: 560px) {
            .container {
                width: min(100% - 28px, 1120px);
            }

            .hero {
                padding: 56px 0 42px;
            }

            .section-heading {
                align-items: start;
                flex-direction: column;
            }

            .detail-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{% url 'catalogo:inicio' %}" aria-label="Tienda de juegos, inicio">
                <span class="brand-mark">J</span> Tienda de juegos
            </a>
            <a class="header-link" href="{% url 'catalogo:inicio' %}#catalogo">Explorar juegos</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">Tienda de juegos</div>
    </footer>
</body>
</html>
